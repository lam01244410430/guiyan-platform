<!-- Manual theme bootstrap: apply the stored choice (default light) as
  data-theme BEFORE first paint, so the page never flashes the wrong
  theme. Choice "system" (or none stored) leaves the attribute unset and
  the CSS media-query fallback decides. Mirrors theme.mjs. -->
<script>try{var __t=localStorage.getItem("guiyan-theme");if(__t==="dark"){document.documentElement.setAttribute("data-theme","dark")}else if(__t==="system"){/* follow system via CSS */}else{document.documentElement.setAttribute("data-theme","light")}}catch(e){}</script>
