<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>桂演 Guiyan — 广西演艺资源平台</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@400;500;700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/main.css" />
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-in">
    <a class="brand" href="#top"><span class="zh">桂演</span><small data-i18n="brandTag"></small></a>
    <nav class="mainnav" id="mainNav">
      <a href="#catalog" data-i18n="navCatalog"></a>
      <a href="#demands" data-i18n="navDemands"></a>
      <a href="#ai" data-i18n="navAssistant"></a>
      <a href="#wechat" data-i18n="navWechat"></a>
    </nav>
    <label class="langsel" aria-label="Language">
      <svg class="globe" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.7 3.8 9S14.5 18.4 12 21c-2.5-2.6-3.8-5.7-3.8-9S9.5 5.6 12 3z"/></svg>
      <select id="langSel" aria-label="Language">
        <option value="vi">Tiếng Việt</option>
        <option value="zh">中文（简体）</option>
        <option value="en">English</option>
        <option value="ja" disabled>日本語 · Sắp có</option>
        <option value="ko" disabled>한국어 · Sắp có</option>
        <option value="th" disabled>ไทย · Sắp có</option>
        <option value="fr" disabled>Français · Sắp có</option>
      </select>
    </label>
    <a class="wxbtn" href="#wechat"><svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M8.7 4C5 4 2 6.6 2 9.8c0 1.8 1 3.4 2.5 4.5l-.6 2.1 2.4-1.2c.5.2 1.1.3 1.7.3.2 0 .4 0 .6-.1A5.6 5.6 0 0 1 8.2 12c0-3.4 3.3-6.1 7.3-6.1h.4C15 4.7 12.1 4 8.7 4zm7.3 3.6c-3.2 0-5.8 2-5.8 4.4s2.6 4.4 5.8 4.4c.6 0 1.1-.1 1.6-.2l2 1-.5-1.8c1.4-.8 2.3-2 2.3-3.4 0-2.4-2.6-4.4-5.8-4.4zM6.6 8.6a.9.9 0 1 1 0 1.8.9.9 0 0 1 0-1.8zm4.7 0a.9.9 0 1 1 0 1.8.9.9 0 0 1 0-1.8zm2.5 2.5a.8.8 0 1 1 0 1.6.8.8 0 0 1 0-1.6zm4.1 0a.8.8 0 1 1 0 1.6.8.8 0 0 1 0-1.6z"/></svg><span data-i18n="navWechat"></span></a>
    <button class="cartbtn" id="openOrders" type="button">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7h15l-1.5 9h-12z"/><path d="M6 7L5 3H2"/><circle cx="9" cy="20" r="1.6"/><circle cx="17" cy="20" r="1.6"/></svg>
      <span class="lbl" data-i18n="myTickets"></span> <b id="orderCount">0</b>
    </button>
    <button class="cartbtn" id="loginBtn" type="button"><span data-i18n="loginBtn"></span></button>
    <span class="authchip" id="loginState" style="display:none"><span id="loginName"></span><button type="button" id="logoutBtn" data-i18n="logoutBtn"></button></span>
  </div>
</header>

<div class="wx-banner" data-i18n="wxBanner"></div>

<!-- ================= HERO ================= -->
<div class="hero" id="top">
  <img class="hero-img" src="assets/img/hero.webp" alt="广西民族艺术舞台夜景" />
  <div class="hero-shade"></div>
  <div class="wrap hero-in">
    <div class="hero-kicker" data-i18n="heroKicker"></div>
    <h1>桂<em>演</em></h1>
    <p class="hero-sub" data-i18n="heroSub"></p>
    <p class="hero-lead" data-i18n="heroLead"></p>
    <form class="hero-search" id="heroSearch">
      <input id="heroQ" type="search" data-i18n-ph="heroSearchPh" aria-label="Search" />
      <button type="submit" data-i18n="searchBtn"></button>
    </form>
    <div class="hero-tags" id="heroTags"></div>
    <div class="hero-stats" id="heroStats"></div>
  </div>
</div>

<!-- ================= CATEGORIES ================= -->
<section id="categories" style="padding-bottom:8px">
  <div class="wrap">
    <div class="sec-head">
      <span class="no">其一</span>
      <h2><span data-i18n="catTitle"></span><span class="sub" data-i18n="catSub"></span></h2>
      <p data-i18n="catNote"></p>
    </div>
    <div class="catrail" id="catRail"></div>
  </div>
</section>

<!-- ================= CATALOG ================= -->
<section id="catalog" style="padding-top:44px">
  <div class="wrap">
    <div class="sec-head">
      <span class="no">其二</span>
      <h2><span data-i18n="cat2Title"></span><span class="sub" data-i18n="cat2Sub"></span></h2>
      <p data-i18n="cat2Note"></p>
    </div>
    <div class="filters" id="catFilters"></div>
    <div class="filters">
      <input class="q" id="q" type="search" data-i18n-ph="searchPh" aria-label="Search" />
      <select id="citySel" aria-label="City"></select>
      <select id="sortSel" aria-label="Sort">
        <option value="hot" data-i18n="sortHot"></option>
        <option value="asc" data-i18n="sortAsc"></option>
        <option value="desc" data-i18n="sortDesc"></option>
        <option value="name" data-i18n="sortName"></option>
      </select>
    </div>
    <p class="resultline" id="resultLine"></p>
    <div class="grid" id="grid"></div>
    <div class="more-row"><button class="btn" id="moreBtn" type="button" data-i18n="moreBtn"></button></div>
  </div>
</section>

<!-- ================= SPOTLIGHT ================= -->
<section style="padding-top:10px">
  <div class="wrap">
    <div class="split">
      <div class="im"><img src="assets/img/spotlight.webp" alt="漓江畔露天舞台黄昏" loading="lazy" /></div>
      <div class="tx">
        <p class="zh" data-i18n="spotKicker"></p>
        <h3 data-i18n="spotTitle"></h3>
        <p data-i18n="spotText"></p>
        <div class="spec">
          <div><b id="spotCities">7</b><span data-i18n="spotS1"></span></div>
          <div><b>10</b><span data-i18n="spotS2"></span></div>
          <div><b>9</b><span data-i18n="spotS3"></span></div>
        </div>
        <button class="btn red" type="button" data-goto-cat="tourism" data-i18n="spotBtn"></button>
      </div>
    </div>
  </div>
</section>

<!-- ================= DEMANDS ================= -->
<section id="demands" style="padding-top:26px">
  <div class="wrap">
    <div class="sec-head">
      <span class="no">其三</span>
      <h2><span data-i18n="demTitle"></span><span class="sub" data-i18n="demSub"></span></h2>
      <p data-i18n="demNote"></p>
      <p style="margin-top:12px"><button type="button" class="btn ghost" id="postDemandBtn" data-i18n="postDemandBtn"></button></p>
    </div>
    <div class="demands" id="demandGrid"></div>
    <div class="matchbox" id="matchBox">
      <h4 id="matchTitle"></h4>
      <p id="matchNote"></p>
      <div class="matchlist" id="matchList"></div>
    </div>
  </div>
</section>

<!-- ================= AI ================= -->
<section id="ai" style="padding-top:26px">
  <div class="wrap">
    <div class="sec-head">
      <span class="no">其四</span>
      <h2><span data-i18n="aiTitle"></span><span class="sub" data-i18n="aiSub"></span></h2>
      <p data-i18n="aiNote"></p>
    </div>
    <div class="ai-grid">
      <div class="ai-copy">
        <p class="zh" data-i18n="aiCopyTitle"></p>
        <p data-i18n="aiCopyText"></p>
        <ul>
          <li><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 6L9 17l-5-5"/></svg><span data-i18n="aiB1"></span></li>
          <li><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 6L9 17l-5-5"/></svg><span data-i18n="aiB2"></span></li>
          <li><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 6L9 17l-5-5"/></svg><span data-i18n="aiB3"></span></li>
        </ul>
        <p style="margin-top:18px;font-weight:700;color:var(--ink)" data-i18n="prefAsk"></p>
        <div class="pref-tags" id="prefTags"></div>
      </div>
      <div class="chat" aria-label="Guiyan assistant">
        <div class="chat-head"><span class="dot"></span><b data-i18n="chatName"></b><span data-i18n="chatMode"></span></div>
        <div class="chat-log" id="chatLog"></div>
        <div class="chat-quick" id="chatQuick"></div>
        <form class="chat-form" id="chatForm">
          <input id="chatIn" type="text" data-i18n-ph="chatPh" aria-label="Chat" />
          <button type="submit" data-i18n="sendBtn"></button>
        </form>
      </div>
    </div>
  </div>
</section>

<!-- ================= WECHAT MINI PROGRAM ================= -->
<section id="wechat" style="padding-top:26px">
  <div class="wrap">
    <div class="sec-head">
      <span class="no" style="border-color:#07c160;color:#07c160">微</span>
      <h2><span data-i18n="wxTitle"></span><span class="sub" data-i18n="wxSub"></span></h2>
      <p data-i18n="wxNote"></p>
    </div>
    <div class="wx-grid">
      <div class="wx-copy">
        <h3 data-i18n="wxCopyTitle"></h3>
        <p data-i18n="wxCopyText"></p>
        <ul>
          <li><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 6L9 17l-5-5"/></svg><span data-i18n="wxB1"></span></li>
          <li><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 6L9 17l-5-5"/></svg><span data-i18n="wxB2"></span></li>
          <li><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 6L9 17l-5-5"/></svg><span data-i18n="wxB3"></span></li>
        </ul>
        <div class="wx-steps">
          <div><b>01</b><span data-i18n="wxS1"></span></div>
          <div><b>02</b><span data-i18n="wxS2"></span></div>
          <div><b>03</b><span data-i18n="wxS3"></span></div>
        </div>
        <p style="margin-top:16px"><a href="https://github.com/lam01244410430/guiyan-platform.git" target="_blank" rel="noopener" style="font-weight:700" data-i18n="wxRepo"></a></p>
      </div>
      <div class="wx-phone" role="region" aria-label="WeChat mini program preview">
        <div class="wx-screen">
          <div class="wx-status"><span>9:41</span><span>5G&nbsp;&nbsp;▰▰▰</span></div>
          <div class="wx-head"><b><span class="zh">桂演</span> · Guiyan</b><span class="wx-capsule">···&nbsp;&nbsp;│&nbsp;&nbsp;◎</span></div>
          <div class="wx-search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="wxQ" type="search" data-i18n-ph="heroSearchPhShort" aria-label="Search mini program" /></div>
          <div class="wx-chips" id="wxChips"></div>
          <div class="wx-body" id="wxBody"></div>
          <nav class="wx-tabbar" id="wxTabs">
            <button type="button" data-wxtab="home"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span data-i18n="wxTabHome"></span></button>
            <button type="button" data-wxtab="catalog"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg><span data-i18n="navCatalog"></span></button>
            <button type="button" data-wxtab="demands"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span data-i18n="navDemands"></span></button>
            <button type="button" data-wxtab="orders"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5 4h14v16l-2.3-1.6L14.4 20l-2.4-1.6L9.6 20l-2.3-1.6L5 20z"/><path d="M9 8h6M9 12h6"/></svg><span data-i18n="myTickets"></span><b id="wxOrderCount" style="display:none">0</b></button>
          </nav>
        </div>
      </div>
    </div>
  </div>
</section>

<footer>
  <div class="wrap">
    <div class="foot-grid">
      <div>
        <span class="zh">桂演 · Guiyan</span>
        <p style="margin:10px 0 0;max-width:420px" data-i18n="footBlurb"></p>
      </div>
      <div>
        <h5 data-i18n="footExplore"></h5>
        <ul>
          <li><a href="#catalog" data-i18n="navCatalog"></a></li>
          <li><a href="#demands" data-i18n="navDemands"></a></li>
          <li><a href="#ai" data-i18n="navAssistant"></a></li>
          <li><button type="button" class="linklike" id="footOrders" data-i18n="myTickets"></button></li>
        </ul>
      </div>
      <div>
        <h5 data-i18n="footCats"></h5>
        <ul id="footCats"></ul>
      </div>
      <div>
        <h5 data-i18n="footHelp"></h5>
        <ul>
          <li><button type="button" class="linklike" data-help="refund" data-i18n="helpRefund"></button></li>
          <li><button type="button" class="linklike" data-help="book" data-i18n="helpBook"></button></li>
          <li><button type="button" class="linklike" data-help="resched" data-i18n="helpResched"></button></li>
        </ul>
      </div>
    </div>
    <div class="foot-note">
      <span>© 2026 桂演 Guiyan</span>
      <span data-i18n="footPrice"></span>
      <a href="https://github.com/lam01244410430/guiyan-platform.git" target="_blank" rel="noopener">GitHub · lam01244410430/guiyan-platform</a>
    </div>
  </div>
</footer>

<!-- detail / booking sheet -->
<div class="overlay" id="overlay" role="dialog" aria-modal="true">
  <div class="sheet" id="sheet"></div>
</div>

<!-- orders drawer -->
<aside class="drawer" id="drawer" aria-label="My tickets">
  <header>
    <h3 data-i18n="myTickets"></h3>
    <button type="button" id="closeDrawer" aria-label="Close">✕</button>
  </header>
  <div class="list" id="orderList"></div>
</aside>

<!-- login dialog (PostgreSQL API auth; password field is empty by design) -->
<div class="auth-overlay" id="loginOverlay" role="dialog" aria-modal="true">
  <form class="auth-card" id="loginForm">
    <button type="button" class="x" id="loginCancel" aria-label="Close">✕</button>
    <h3 data-i18n="loginTitle"></h3>
    <input id="loginUser" type="text" value="demo" autocomplete="username" data-i18n-ph="userPh" />
    <input id="loginPass" type="password" value="" autocomplete="current-password" data-i18n-ph="passPh" />
    <div class="err" id="loginErr"></div>
    <div class="row"><button class="btn red" type="submit" data-i18n="loginBtn"></button></div>
  </form>
</div>

<!-- post-demand dialog -->
<div class="auth-overlay" id="demandOverlay" role="dialog" aria-modal="true">
  <form class="auth-card" id="demandForm">
    <button type="button" class="x" id="demandCancel" aria-label="Close">✕</button>
    <h3 data-i18n="postDemandTitle"></h3>
    <input id="demTitle" type="text" data-i18n-ph="demTitlePh" />
    <select id="demCat"></select>
    <input id="demBudget" type="number" min="0" step="1" data-i18n-ph="demBudgetPh" />
    <select id="demCity"></select>
    <textarea id="demDesc" data-i18n-ph="demDescPh"></textarea>
    <div class="row"><button class="btn red" type="submit" data-i18n="postDemandBtn"></button></div>
  </form>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="assets/js/data.js"></script>

<script src="assets/js/app.js"></script>
</body>
</html>
