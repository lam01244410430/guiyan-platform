# Guiyan — full stack (phase 8). Run: cp .env.example .env && docker compose up -d
# Production stays on Vercel + Neon; this file is for local/docker runs only.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: guiyan
      POSTGRES_PASSWORD: guiyan
      POSTGRES_DB: guiyan
    volumes:
      - guiyan-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guiyan -d guiyan"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${GUIYAN_PORT:-3001}:3001"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://guiyan:guiyan@db:5432/guiyan
      REDIS_URL: redis://redis:6379
      STATIC_DIR: dist
      PORT: "3001"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3001/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
  # Python AI service (phase 7) — contract only in phase 8: there is no
  # Dockerfile under python-ai/ yet. Profile `ai` is OFF by default, so
  # compose never builds it. To enable in phase 7:
  # `docker compose --profile ai up -d` and set
  # AI_CHAT_URL=http://ai:5000/api/chat in .env. The api does NOT depend on
  # ai — the Node proxy fails open to the rule engine when ai is absent.
  ai:
    profiles: ["ai"]
    build: ./python-ai
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:5000/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  guiyan-pgdata:
