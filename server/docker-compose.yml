# Guiyan local database — PostgreSQL 16 for development only.
# The guiyan/guiyan credentials below are local-dev defaults, not production
# secrets. Production must use its own DATABASE_URL with a strong password.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: guiyan
      POSTGRES_PASSWORD: guiyan
      POSTGRES_DB: guiyan
    ports:
      - "5432:5432"
    volumes:
      - guiyan-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guiyan -d guiyan"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  guiyan-pgdata:
